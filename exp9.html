<!DOCTYPE html>
<html lang="en">
<head>
    <title>CSS Background and Links</title>
    <style>
        body {
            background-image: url('background.jpg');
            background-repeat: no-repeat;
        }

        h2 {
            margin-top: 0;
            color: #333;
        }

        .content-box {
            background-color: rgba(255, 255, 255, 0.9); /* White with slight transparency */
            padding: 40px 60px;
            border-radius: 10px;
            box-shadow: 0px 4px 15px rgba(0, 0, 0, 0.2);
            text-align: center;
            width: 400px;
            margin: 50px auto;
        }

        a:link {
            color: blue;
            text-decoration: none;
        }
        a:visited {
            color: purple;
        }
        a:hover {
            color: red;
            text-decoration: underline;
        }
        a:active {
            color: green;
        }
    </style>
</head>
<body>
    <div class="content-box">
        <h2>CSS Link and Background Styles</h2>
        <p><a href="https://example.com" target="_blank">Test Link</a></p>
    </div>
</body>
</html>
